FF" opacity="0.23"/><circle cx="350.8" cy="375.96" r="0.84" fill="#EEDCA8" opacity="0.32"/><circle cx="304.62" cy="235.16" r="0.83" fill="#FFFFFF" opacity="0.32"/><circle cx="481.27" cy="284.01" r="1.1" fill="#FFFFFF" opacity="0.41"/><circle cx="375.39" cy="96.08" r="1.38" fill="#FFFFFF" opacity="0.5"/><circle cx="339.9" cy="151.08" r="0.65" fill="#FFFFFF" opacity="0.26"/>

  <!-- 辉光垫在主体下面：先有光，才有轮廓 -->
