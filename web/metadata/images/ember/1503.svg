      fill="#FFFFFF" opacity="0.4"/>
    <path d="M426.09 223.18 L427.21 235.5 L426.09 247.82 L424.97 235.5Z"
      fill="#FFFFFF" opacity="0.4"/>

  <!-- 辉光垫在主体下面：先有光，才有轮廓 -->
