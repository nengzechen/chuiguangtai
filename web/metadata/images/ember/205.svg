ircle cx="289.06" cy="279.28" r="1.1" fill="#FFFFFF" opacity="0.41"/><circle cx="426.2" cy="176.49" r="0.66" fill="#7FAEFF" opacity="0.27"/><circle cx="51.19" cy="318.67" r="1" fill="#FFFFFF" opacity="0.38"/><circle cx="205.07" cy="109.1" r="0.47" fill="#FFFFFF" opacity="0.2"/><circle cx="332.9" cy="19.88" r="0.52" fill="#7FAEFF" opacity="0.22"/><circle cx="164.88" cy="151.15" r="1.84" fill="#7FAEFF" opacity="0.65"/><circle cx="319.89" cy="422.6" r="0.41" fill="#7FAEFF" opacity="0.18"/><circle cx="371.94" cy="268.27" r="1.02" fill="#7FAEFF" opacity="0.38"/><circle cx="23.19" cy="178.3" r="0.53" fill="#FFFFFF" opacity="0.22"/><circle cx="246.68" cy="373.43" r="0.79" fill="#FFFFFF" opacity="0.31"/><circle cx="343.57" cy="323.36" r="0.49" fill="#FFFFFF" opacity="0.21"/><circle cx="33.72" cy="229" r="0.89" fill="#FFFFFF" opacity="0.34"/>

  <!-- 辉光垫在主体下面：先有光，才有轮廓 -->
