      fill="#FFFFFF" opacity="0.4"/><circle cx="333.47" cy="195.31" r="0.41" fill="#FFFFFF" opacity="0.18"/><circle cx="476.97" cy="476.08" r="1.71" fill="#FFFFFF" opacity="0.61"/><circle cx="114.77" cy="397.28" r="0.4" fill="#FFFFFF" opacity="0.18"/>

  <!-- 辉光垫在主体下面：先有光，才有轮廓 -->
