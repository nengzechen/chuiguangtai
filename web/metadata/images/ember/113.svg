<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="sky113" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#2A2270" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0A0A1E" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow113">
      <stop offset="0%" stop-color="#E6ECFF" stop-opacity="0.55"/>
      <stop offset="28%" stop-color="#7C8CFF" stop-opacity="0.26"/>
      <stop offset="62%" stop-color="#2A2270" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2A2270" stop-opacity="0"/>
    </radialGradient>
    <!--
      主体：临边昏暗。恒星的边比心暗，因为你在边上看到的是更外、更冷的一层。
      白心收在 10% 以内 —— 放到 18% 时，A/F 这些本来就近白的光谱型
      会把整颗星糊成一个白球，光谱型这个特征就白设了。
    -->
    <radialGradient id="body113" cx="42%" cy="38%" r="74%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="10%" stop-color="#E6ECFF"/>
      <stop offset="44%" stop-color="#7C8CFF"/>
      <stop offset="100%" stop-color="#2A2270"/>
    </radialGradient>
    <!-- 光束的衰减：以星为心，所以两道束共用一条渐变，且与角度无关 -->
    <radialGradient id="beam113" cx="250" cy="250" r="362.75"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="22%" stop-color="#E6ECFF" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#7C8CFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk113" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C8CFF"/>
      <stop offset="35%" stop-color="#E6ECFF"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7C8CFF"/>
    </linearGradient>
  </defs>

  <!-- 满幅。没有留白边、没有题记条 —— 画面就是画面 -->
  <rect width="500" height="500" fill="#0A0A1E"/>
  <rect width="500" height="500" fill="url(#sky113)"/>
