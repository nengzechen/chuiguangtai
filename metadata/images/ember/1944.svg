le cx="126.53" cy="50.81" r="0.4" fill="#FFFFFF" opacity="0.18"/><circle cx="122.13" cy="137.03" r="0.41" fill="#FFFFFF" opacity="0.18"/><circle cx="234.19" cy="92.61" r="0.4" fill="#FFFFFF" opacity="0.18"/><circle cx="93.44" cy="495.55" r="0.9" fill="#FFFFFF" opacity="0.34"/><circle cx="271.48" cy="320.25" r="1.59" fill="#FF6242" opacity="0.57"/><circle cx="0.14" cy="313.87" r="0.64" fill="#FF6242" opacity="0.26"/><circle cx="140.83" cy="400.12" r="1.47" fill="#FFFFFF" opacity="0.53"/><circle cx="192.97" cy="322.03" r="1.66" fill="#FF6242" opacity="0.59"/><circle cx="210.11" cy="320.06" r="0.8" fill="#FFFFFF" opacity="0.31"/><circle cx="127.01" cy="150.98" r="2.06" fill="#FF6242" opacity="0.72"/><path d="M115.68 150.98 L127.01 149.95 L138.34 150.98 L127.01 152.01Z"
