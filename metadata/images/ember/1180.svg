<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="sky1180" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#6B300E" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#140C08" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow1180">
      <stop offset="0%" stop-color="#FFE3BC" stop-opacity="0.55"/>
      <stop offset="28%" stop-color="#FF9A3D" stop-opacity="0.26"/>
      <stop offset="62%" stop-color="#6B300E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6B300E" stop-opacity="0"/>
    </radialGradient>
    <!--
      主体：临边昏暗。恒星的边比心暗，因为你在边上看到的是更外、更冷的一层。
      白心收在 10% 以内 —— 放到 18% 时，A/F 这些本来就近白的光谱型
      会把整颗星糊成一个白球，光谱型这个特征就白设了。
    -->
    <radialGradient id="body1180" cx="42%" cy="38%" r="74%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="10%" stop-color="#FFE3BC"/>
      <stop offset="44%" stop-color="#FF9A3D"/>
      <stop offset="100%" stop-color="#6B300E"/>
    </radialGradient>
    <!-- 光束的衰减：以星为心，所以两道束共用一条渐变，且与角度无关 -->
    <radialGradient id="beam1180" cx="250" cy="250" r="383.08"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="22%" stop-color="#FFE3BC" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#FF9A3D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF9A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk1180" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9A3D"/>
      <stop offset="35%" stop-color="#FFE3BC"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF9A3D"/>
    </linearGradient>
  </defs>

  <!-- 满幅。没有留白边、没有题记条 —— 画面就是画面 -->
